# pytest configuration file

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 分离测试类型
markers =
    unit: 单元测试，不依赖外部服务
    integration: 集成测试，依赖外部服务
    e2e: 端到端测试，依赖完整的系统
    slow: 慢速测试，含time.sleep或长时间运行

# 默认运行所有测试
# addopts = -m "unit"
addopts = --ignore=tests/test_simple_pdf_gen.py -m "not slow"